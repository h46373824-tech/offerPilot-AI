name: Feature request
description: Suggest a scoped product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Who benefits and what problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data and privacy impact
      description: Identify external sources, personal data, retention or authentication changes.
